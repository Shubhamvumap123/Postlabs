name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: client/package.json

      - name: Install backend dependencies
        run: cd server && pnpm install --no-frozen-lockfile

      - name: Install frontend dependencies
        run: cd client && pnpm install --no-frozen-lockfile

      - name: Run linter
        run: cd client && pnpm run lint || true

      - name: Run build
        run: cd client && pnpm run build || true

      - name: Install Playwright Browsers
        run: cd client && pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: cd client && pnpm exec playwright test
